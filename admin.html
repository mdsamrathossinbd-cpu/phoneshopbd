<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Phone Shop BD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="form-body">
    <div class="form-container" style="width: 500px;">
        <h2>🛠️ এডমিন প্যানেল</h2>
        <div id="admin-msg" style="color: #fad0c4; margin-bottom: 15px; text-align: center;"></div>
        <form id="admin-product-form">
            <div class="input-group">
                <label>প্রোডাক্টের নাম</label>
                <input type="text" id="p-name" placeholder="যেমন: iPhone 16 Pro" required>
            </div>
            <div class="input-group">
                <label>মূল্য (টাকা)</label>
                <input type="text" id="p-price" placeholder="যেমন: ৳ 75,000" required>
            </div>
            <div class="input-group">
                <label>ছবির ফাইলের নাম বা লিংক</label>
                <input type="text" id="p-img" placeholder="যেমন: iphone_14.jpeg" required>
            </div>
            <button type="submit" class="btn-submit">প্রোডাক্ট যোগ করুন</button>
        </form>
        <div class="form-link" style="margin-top: 20px;">
            <a href="index.html">← সাইটে ফিরে যান</a>
        </div>
    </div>
    <script type="module" src="JavaScript.js"></script>
</body>
</html>
